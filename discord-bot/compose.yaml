services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/notifications.sqlite
      PORT: "3000"
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - bot-data:/app/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  bot-data:
